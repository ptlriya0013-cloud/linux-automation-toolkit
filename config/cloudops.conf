# cloudops.conf — central configuration for the Linux Server Automation Toolkit
# This file is sourced (not executed) by every script in scripts/

# --- Paths ---
TOOLKIT_DIR="${TOOLKIT_DIR:-$HOME/linux-automation-toolkit}"
LOG_DIR="$TOOLKIT_DIR/logs"
BACKUP_DIR="$HOME/backups"

# --- Thresholds ---
DISK_ALERT_THRESHOLD=80     # percent
LOG_RETENTION_DAYS=7         # delete logs older than this

# --- Database (used by database-backup.sh) ---
DB_TYPE="mysql"
DB_USER="backup_user"
DB_NAME="myappdb"

# --- Behavior ---
DEFAULT_LOG_LEVEL="INFO"     # INFO, WARN, ERROR
